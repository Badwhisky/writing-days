function ideaBank(){var a=S.ideas,h='<details class="card" id="ib"'+(UI.ib?' open':'')+' ontoggle="UI.ib=this.open"><summary>'+ic("spark",20)+' <b>Idea bank</b> ('+a.length+')</summary><p class="tip">Capture every idea here, even half-formed ones. Start your next film from the best one.</p><div class="row"><input type="text" id="ni" maxlength="200" placeholder="A film idea in one line" aria-label="Film idea" onkeydown="if(event.key===\'Enter\')iadd()"><button class="b" onclick="iadd()">Save idea</button><button class="b alt" onclick="spark()">Spark one</button></div>';
a.forEach(function(x,i){h+='<div class="it"><div class="t">'+esc(x.t)+'</div><button class="b alt" onclick="istart('+i+')">Make it my next film</button><button class="x" aria-label="Remove idea" onclick="idel('+i+')">×</button></div>'});
return h+'</details>'}
function iadd(){var el=document.getElementById("ni"),v=el.value.trim();if(!v){el.focus();return}S.ideas.unshift({t:v});UI.ib=true;save();render();document.getElementById("ni").focus()}
function spark(){var el=document.getElementById("ni");el.value="Premise: "+SA[Math.floor(Math.random()*SA.length)]+". Complication: "+SB[Math.floor(Math.random()*SB.length)]+".";el.focus()}
function idel(i){S.ideas.splice(i,1);save();render()}
function istart(i){var t=S.ideas[i].t,cur=film(),f={id:"f"+Date.now(),title:t.slice(0,80),done:{},notes:{},t:{logline:t},l:{},fmt:cur?cur.fmt:"ldr"};S.ideas.splice(i,1);S.films.push(f);S.active=f.id;UI.open=0;UI.form=false;save();render();window.scrollTo(0,0)}
function fountain(f){var o="Title: "+f.title+"\nCredit: Written by\nAuthor: \n\n";sp(f).forEach(function(x){var t=x.t.trim();if(!t||t=="()")return;
if(x.k=="s"){t=t.toUpperCase();if(!/^(INT|EXT|EST|I\/E)/.test(t))t="."+t;o+="\n"+t+"\n\n"}
else if(x.k=="c")o+=t.toUpperCase()+"\n";
else if(x.k=="p")o+=(/^\(/.test(t)?t:"("+t+")")+"\n";
else if(x.k=="t"){t=t.toUpperCase();o+=(/TO:$/.test(t)?t:"> "+t)+"\n\n"}
else o+=t+"\n\n"});return o}

function ic(n,s){s=s||18;return'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function enter(){var c=document.getElementById("stg");if(c){c.classList.remove("in");void c.offsetWidth;c.classList.add("in")}}
function celebrate(msg,n){var cols=["#f5c518","#fb7185","#e879f9","#8b5cf6","#06b6d4","#22c55e"],w=document.createElement("div");w.className="cf";w.setAttribute("aria-hidden","true");for(var i=0;i<n;i++){var p=document.createElement("i");p.style.cssText="left:"+Math.random()*100+"%;background:"+cols[i%6]+";animation-delay:"+Math.random()*.4+"s;--x:"+(Math.random()*160-80)+"px";w.appendChild(p)}var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(w);document.body.appendChild(t);setTimeout(function(){w.remove();t.remove()},3600)}
function go(d){var s=UI.open+d;if(s<0||s>5)return;UI.open=s;render();window.scrollTo(0,0);enter()}
function cnt(f,s){var c=0;STAGES[s].i.forEach(function(_,k){if(f.done[s+"-"+k])c++});return c}
function total(f){var c=0;STAGES.forEach(function(_,s){c+=cnt(f,s)});return c}
function isDone(f){return total(f)===24}
function streak(){var d=new Date(),n=0;if(S.days.indexOf(ds(d))<0)d.setDate(d.getDate()-1);while(S.days.indexOf(ds(d))>=0){n++;d.setDate(d.getDate()-1)}return n}
function nextItem(f){for(var s=0;s<6;s++)for(var k=0;k<4;k++)if(!f.done[s+"-"+k])return[s,k]}
function addFilm(){var el=document.getElementById("nt"),t=el.value.trim();if(!t){el.focus();return}
var f={id:"f"+Date.now(),title:t,done:{},notes:{},t:{},l:{},fmt:document.getElementById("nf").value};S.films.push(f);S.active=f.id;UI.form=false;UI.open=0;save();render()}
function tog(s,k){var f=film(),key=s+"-"+k,on=!f.done[key];f.done[key]=on;save();render();if(on){if(isDone(f))celebrate("Film finished! You made a film.",70);else if(cnt(f,s)==4)celebrate(STAGES[s].n+" complete. Frame filled!",36)}}
function note(s,v){film().notes[s]=v;save()}
function setf(k,v){film().t[k]=v;save();if(k=="script"){var w=v.trim()?v.trim().split(/\s+/).length:0,e=document.getElementById("wc");if(e)e.textContent=wcText(w)}}
function setdate(v){film().t.date=v;save();render()}
function ladd(k){var el=document.getElementById("li-"+k),v=el.value.trim();if(!v){el.focus();return}var f=film();(f.l[k]=f.l[k]||[]).push({t:v,d:0});save();render();document.getElementById("li-"+k).focus()}
function ltog(k,i){var a=film().l[k][i];a.d=a.d?0:1;save();render()}
function ldel(k,i){film().l[k].splice(i,1);save();render()}
function logDay(){var t=ds(new Date());if(S.days.indexOf(t)<0)S.days.push(t);save();render()}
function pick(s){UI.open=UI.open===s?-1:s;render();enter()}
function stuck(){UI.msg=UNSTICK[Math.floor(Math.random()*UNSTICK.length)];render()}
function sprint(){if(UI.end){UI.end=null;clearInterval(TM);UI.msg="";render();return}UI.end=Date.now()+600000;UI.msg="";TM=setInterval(tick,1000);render()}
function tick(){var l=UI.end-Date.now();if(l<=0){clearInterval(TM);UI.end=null;UI.msg="Sprint done and today is logged. That’s a win. Keep going, or stop proudly.";logDay();return}var el=document.getElementById("tm");if(el)el.textContent=Math.floor(l/60000)+":"+String(Math.floor(l%60000/1000)).padStart(2,"0")}
function days2(f){if(!f.t.date)return null;var a=new Date(f.t.date+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function exportTxt(f){var o=f.title+"\n\n";STAGES.forEach(function(g,s){o+="== "+g.n+" ==\n";g.f.forEach(function(x){o+=x[1]+":\n"+(f.t[x[0]]||"")+"\n\n"});g.l.forEach(function(x){o+=x[1]+":\n"+(f.l[x[0]]||[]).map(function(a){return(a.d?"[x] ":"[ ] ")+a.t}).join("\n")+"\n\n"});o+="Reflection: "+(f.notes[s]||"")+"\n\n"});o+="== Idea bank ==\n"+S.ideas.map(function(a){return"- "+a.t}).join("\n")+"\n";return o}
function render(){
var f=film(),fin=S.films.filter(isDone).length,st=streak();
document.getElementById("stats").innerHTML='<div class="chip"><i style="--b:#f5c518">'+ic("trophy",20)+'</i><div><b>'+fin+'</b>films finished</div></div><div class="chip"><i style="--b:#fb923c">'+ic("flame",20)+'</i><div><b>'+st+'</b>day streak</div></div>';
var h="";
if(!f||UI.form){
h+='<div class="card"><h3>'+(S.films.length?"Start a new film":"Start your first film")+'</h3><p class="tip">Small is fine. A short film you finish teaches more than a feature you don’t.</p><div class="row"><select id="nf" aria-label="Format">'+fmtOpts("ldr")+'</select><input type="text" id="nt" placeholder="Working title" aria-label="Working title" maxlength="80"><button class="b" onclick="addFilm()">Start film</button>'+(f?'<button class="b alt" onclick="UI.form=false;render()">Cancel</button>':'')+'</div></div>';
}
if(f){
if(UI.open===null){var n0=nextItem(f);UI.open=n0?n0[0]:5}
var tot=total(f),n=nextItem(f),dd=days2(f),msg;
if(!n){msg='<p class="k">You finished “'+esc(f.title)+'”. That’s the hard part, and you did it.</p><p>Keep the momentum. Write the logline for your next film this week.</p>'}
else{msg='<p class="k">'+LINES[tot%LINES.length]+'</p><p><b>Next step:</b> '+STAGES[n[0]].i[n[1]][0]+'.</p><p><b>To get better:</b> '+STAGES[n[0]].i[n[1]][1]+'</p>'}
if(dd!==null&&n)msg+='<p><b>'+(dd>0?dd+' days to your premiere.':dd==0?'Premiere day.':'Your premiere date has passed. Pick a new one.')+'</b></p>';
if(UI.msg)msg+='<p class="k">'+UI.msg+'</p>';
msg+='<p class="tip">Format: '+FMT[f.fmt].name+' ('+FMT[f.fmt].len+')</p>';

h+='<div class="card coach"><h3 class="hd">'+ic("spark",20)+' Your coach</h3>'+msg;
if(UI.end)h+='<p>Only this matters for the next 10 minutes. Work on your next step.</p><div class="timer" id="tm">10:00</div>';
h+='<div class="row" style="margin-top:12px"><button class="b" onclick="sprint()">'+ic("timer",16)+' '+(UI.end?"Stop sprint":"Start a 10-minute sprint")+'</button><button class="b alt" onclick="stuck()">'+ic("help",16)+' I’m stuck</button><button class="b alt" onclick="logDay()"'+(today?' disabled style="opacity:.6"':'')+'>'+ic("check",16)+" "+(today?"Logged today":"Log today")+'</button></div><div class="dots" aria-label="Last 7 days">';
for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);h+='<span class="'+(S.days.indexOf(ds(d))>=0?"on":"")+'" title="'+ds(d)+'"></span>'}
h+='</div></div>';
h+=ideaBank();h+='<div class="row" style="align-items:center;margin-bottom:4px"><select id="sel" aria-label="Choose film" onchange="S.active=this.value;UI.open=null;save();render()">';
S.films.forEach(function(x){h+='<option value="'+x.id+'"'+(x.id===S.active?" selected":"")+'>'+esc(x.title)+(isDone(x)?" (finished)":"")+'</option>'});
h+='</select><select aria-label="Format" onchange="film().fmt=this.value;save();render()">'+fmtOpts(f.fmt)+'</select><button class="b alt" onclick="UI.form=true;render();document.getElementById(\'nt\').focus()">'+ic("plus",16)+' New film</button><button class="b alt" onclick="UI.exp=UI.exp==\'sp\'?false:\'sp\';render()">'+ic("dl",16)+' Export screenplay</button><button class="b alt" onclick="UI.exp=UI.exp==\'nt\'?false:\'nt\';render()">'+ic("dl",16)+' Export notes</button></div>';
if(UI.exp)h+='<div class="card"><h3>'+(UI.exp=="sp"?"Screenplay":"Notes and planning")+'</h3><p class="tip">'+(UI.exp=="sp"?"Plain-text screenplay format (Fountain) that most screenwriting apps can import. Copy it into a .fountain or .txt file.":"Loglines, beat outline, shot lists, schedule, invite list, reflections and your idea bank. The screenplay is exported separately.")+'</p><textarea class="big" id="ex" readonly onfocus="this.select()">'+esc(UI.exp=="sp"?fountain(f):exportTxt(f))+'</textarea><div class="row" style="margin-top:8px"><button class="b" id="cpb" onclick="cp()">Copy</button><button class="b alt" onclick="UI.exp=false;render()">Close</button></div></div>';
h+='<div class="strip" role="group" aria-label="Stages">';
STAGES.forEach(function(g,s){var c=cnt(f,s);h+='<button class="fr'+(UI.open===s?" on":"")+'" onclick="pick('+s+')" aria-label="'+g.n+' '+c+' of 4"><i style="background:'+g.c2+';transform:scaleX('+c/4+')"></i><span>'+ic(STIC[s],18)+'<em>'+g.n+'</em></span></button>'});
h+='</div>';
var s=UI.open;
if(s>=0){var g=STAGES[s];h+='<div class="card" id="stg" style="--c1:'+g.c1+';--c2:'+g.c2+'"><div class="banner"><span class="big">'+ic(STIC[s],96)+'</span><div><h2>'+g.n+'</h2><small>Study: <b>'+STUDY[f.fmt][s][0]+'</b>. '+STUDY[f.fmt][s][1]+'</small></div></div><p class="k" style="margin:0 0 6px">'+HINT[f.fmt][s]+'</p><div class="tip" style="margin-bottom:6px">'+cnt(f,s)+' of 4 steps done</div>';
g.i.forEach(function(it,k){var d=f.done[s+"-"+k];h+='<div class="it'+(d?" d":"")+'"><input type="checkbox" id="c'+k+'"'+(d?" checked":"")+' onchange="tog('+s+','+k+')"><label for="c'+k+'" class="t"><div>'+it[0]+'</div>'+(d?'':'<div class="tip">'+it[1]+'</div>')+'</label></div>'});
if(g.date)h+='<h3 class="w">Premiere date</h3><input type="date" aria-label="Premiere date" value="'+esc(f.t.date||"")+'" onchange="setdate(this.value)">';
g.f.forEach(function(x){h+='<h3 class="w">'+x[1]+'</h3><textarea'+(x[3]?' class="big"':'')+' aria-label="'+x[1]+'" oninput="setf(\''+x[0]+'\',this.value)" placeholder="'+x[2]+'">'+esc(f.t[x[0]]||"")+'</textarea>';

if(g.sp)h+=editor(f);g.l.forEach(function(x){var a=f.l[x[0]]||[];h+='<h3 class="w">'+x[1]+'</h3>';
a.forEach(function(e,i){h+='<div class="it'+(e.d?" d":"")+'"><input type="checkbox" aria-label="Done"'+(e.d?" checked":"")+' onchange="ltog(\''+x[0]+'\','+i+')"><div class="t">'+esc(e.t)+'</div><button class="x" aria-label="Remove" onclick="ldel(\''+x[0]+'\','+i+')">×</button></div>'});
h+='<div class="row" style="margin-top:8px"><input type="text" id="li-'+x[0]+'" placeholder="'+x[2]+'" aria-label="'+x[2]+'" onkeydown="if(event.key==\'Enter\')ladd(\''+x[0]+'\')"><button class="b" onclick="ladd(\''+x[0]+'\')">Add</button></div>'});
h+='<h3 class="w">Reflection: '+g.q+'</h3><textarea aria-label="Reflection" oninput="note('+s+',this.value)" placeholder="A sentence or two is enough.">'+esc(f.notes[s]||"")+'</textarea><div class="row" style="margin-top:14px;justify-content:space-between">'+(s>0?'<button class="b alt" onclick="go(-1)">'+ic("back",16)+' Back: '+STAGES[s-1].n+'</button>':'<span></span>')+(s<5?'<button class="b" onclick="go(1)">Next: '+STAGES[s+1].n+' '+ic("next",16)+'</button>':'')+'</div></div>'}
}
document.getElementById("app").innerHTML=h+(f?"":ideaBank());document.querySelectorAll(".spt").forEach(fit);UI.spi=null;hl();var cs=f?STAGES[Math.max(UI.open,0)]:null,rs=document.documentElement.style;rs.setProperty("--t1",cs?cs.c1:"#2457d6");rs.setProperty("--t2",cs?cs.c2:"#8fb0ff");
}
render();
</script></body></html>
